name: Semgrep

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    semgrep:
        runs-on: ubuntu-latest
        container:
            image: returntocorp/semgrep

        steps:
            - uses: actions/checkout@v3

            - name: Run Semgrep
              run: semgrep --config=p/security-audit --json -o semgrep-results.json .
              continue-on-error: true

            - name: Upload results
              uses: github/codeql-action/upload-sarif@v2
              with:
                  sarif_file: semgrep-results.json
              if: always()
