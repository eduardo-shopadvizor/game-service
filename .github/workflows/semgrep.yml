name: Semgrep

on:
    push:
        branches: [ main, dev ]
    pull_request:
        branches: [ main, dev ]

jobs:
    semgrep:
        runs-on: ubuntu-latest
        container:
            image: returntocorp/semgrep

        steps:
            - uses: actions/checkout@v4

            - name: Run Semgrep
              run: semgrep --config=p/security-audit --sarif -o semgrep-results.sarif .
              continue-on-error: true

            - name: Upload results
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: semgrep-results.sarif
              if: always()
