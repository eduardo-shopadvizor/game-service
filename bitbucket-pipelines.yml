image: php:8.3-cli

pipelines:
  default:
    - step:
        name: Test & Lint
        caches:
          - composer
        script:
          - apt-get update && apt-get install -y git unzip libpq-dev
          - docker-php-ext-install pdo pdo_pgsql
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - composer install
          - composer lint
          - composer test
